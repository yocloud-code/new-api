services:
  one-api:
    image: ghcr.io/yocloud-code/one-router-api:latest
    container_name: one-router-api
    restart: always
    environment:
      - SQL_DSN=root:Yocloud@2026!@tcp(mysql:3306)/one_router_api?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_CONN_STRING=redis://redis:6379/1
      - SESSION_SECRET=one-router-cloud-secret-x7k9m2
      - SYNC_FREQUENCY=60
      - BATCH_UPDATE_INTERVAL=120
      - MEMORY_CACHE_ENABLED=true
      - GLOBAL_API_RATE_LIMIT=1200
      - STREAMING_TIMEOUT=600
      - NODE_NAME=one-router-node-1
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
      - ./images:/data/images
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - openapiyocloudclub_openapi

  watchtower:
    image: containrrr/watchtower
    container_name: one-router-watchtower
    restart: always
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.45
      - TZ=Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  openapiyocloudclub_openapi:
    external: true
